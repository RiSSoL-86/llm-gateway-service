services:
  llm-gateway-service:
    build:
      context: .
      dockerfile: etc/docker/prod/Dockerfile
    network_mode: "host"
    env_file:
      - src/.env
    restart: always
    logging:
      driver: awslogs
      options:
        awslogs-region: ${AWS_REGION:?Set AWS_REGION in src/.env}
        awslogs-group: ${LOG_GROUP:?Set LOG_GROUP in src/.env}
        awslogs-stream: ${LOG_STREAM:?Set LOG_STREAM in src/.env}
        mode: non-blocking
        max-buffer-size: 4m
    depends_on:
      db:
        condition: service_healthy

  # HTTPS on 443, Let's Encrypt for PUBLIC_HOST; server-sent events unbuffered
  caddy:
    image: caddy:2-alpine
    command: ["caddy", "reverse-proxy", "--from", "${PUBLIC_HOST:?Set PUBLIC_HOST in src/.env}", "--to", "localhost:${PORT:?Set PORT in src/.env}"]
    network_mode: "host"
    volumes:
      - caddy_data:/data
    restart: always
    depends_on:
      - llm-gateway-service

  db:
    image: postgres:16-alpine
    command: ["postgres", "-p", "${POSTGRES_PORT:?Set POSTGRES_PORT in src/.env}"]
    network_mode: "host"
    env_file:
      - src/.env
    volumes:
      - postgres_data:/var/lib/postgresql/data
    restart: always
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -p $$POSTGRES_PORT -U $$POSTGRES_USER -d $$POSTGRES_DB"]
      interval: 5s
      timeout: 5s
      retries: 10

volumes:
  postgres_data:
  caddy_data:
